<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Support for Pocket Crayons, a calm colouring app for little artists.">
  <title>Pocket Crayons Support</title>
  <style>
    :root { color-scheme: light; --ink: #303a48; --paper: #fff8eb; --orange: #ff9027; --line: #e8ded0; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 19px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { width: min(680px, calc(100% - 40px)); margin: 0 auto; padding: 92px 0 64px; }
    .mark { width: 70px; height: 54px; margin-bottom: 24px; background: var(--orange); border-radius: 52% 45% 43% 55%; transform: rotate(-8deg); position: relative; }
    .mark::after { content: ""; position: absolute; width: 17px; height: 17px; left: 27px; top: 19px; border-radius: 50%; background: var(--paper); box-shadow: -18px -8px 0 -2px var(--paper), 19px -9px 0 -2px var(--paper), -15px 13px 0 -3px var(--paper); }
    h1 { margin: 0; color: #111; font-size: clamp(2.25rem, 7vw, 3.6rem); line-height: 1.05; letter-spacing: -0.04em; }
    h2 { margin-top: 48px; font-size: 1.4rem; color: #111; }
    .tagline { margin: 16px 0 44px; color: #69717d; font-size: 1.25rem; }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 24px; padding: 28px; box-shadow: 0 10px 30px rgba(69, 52, 28, .06); }
    a { color: #a84d00; font-weight: 650; }
    footer { margin-top: 64px; color: #69717d; font-size: .9rem; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Pocket Crayons</h1>
    <p class="tagline">A little space for big imaginations.</p>
    <section class="card">
      <h2 style="margin-top:0">Hello, grown-ups</h2>
      <p>Pocket Crayons is a calm, simple colouring app made for little artists aged 2–6.</p>
      <p>Need a hand? Email <a href="mailto:udesou@gmail.com">udesou@gmail.com</a>.</p>
      <p><a href="privacy.html">Read the Pocket Crayons Privacy Policy</a></p>
    </section>
    <footer>© 2026 Pocket Crayons</footer>
  </main>
</body>
</html>
